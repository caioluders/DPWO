name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: make build

      - name: Build binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/pip install --upgrade pip
          .venv/Scripts/pip install -r requirements.txt
          .venv/Scripts/pip install -r requirements-dev.txt
          .venv/Scripts/pyinstaller --onefile --console --name dpwo --add-data "plugins;plugins" dpwo.py
          .venv/Scripts/pyinstaller --onefile --windowed --name dpwo-gui --add-data "plugins;plugins" gui.py

      - name: Rename binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mv dist/dpwo dist/dpwo-${{ matrix.platform }}
          mv dist/dpwo-gui dist/dpwo-gui-${{ matrix.platform }}

      - name: Rename binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          mv dist/dpwo.exe dist/dpwo-windows.exe
          mv dist/dpwo-gui.exe dist/dpwo-gui-windows.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dpwo-${{ matrix.platform }}
          path: dist/dpwo-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
